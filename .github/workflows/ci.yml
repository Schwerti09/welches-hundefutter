name: CI

# Gate fuer main: typecheck + lint + build + test muessen gruen sein.
# Roadmap: BELLA_NEXT_LEVEL.md Op 0.4

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bella-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bella-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (inkl. blockierender Allergen-Eval gegen die echte DB)
        run: npm test
        env:
          # DATABASE_URL als Repo-Secret -> die Allergen-Eval (src/lib/advisor/
          # allergen-eval.test.ts) laeuft gegen Neon. Ohne Secret wird sie
          # uebersprungen (describe.skipIf), der Rest der Tests laeuft normal.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
