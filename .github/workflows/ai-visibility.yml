name: KI-Sichtbarkeit prüfen

# Manueller Fallback/Debug — der wöchentliche Lauf passiert seit der Netlify-Migration
# über netlify/functions/ai-visibility.mts (Scheduled Function, montags 07:00 UTC).
#
# Nötige Repo-Secrets (zusätzlich zu DATABASE_URL):
#   GEMINI_API_KEY     – wie in Netlify-Env (Advisor)
#   ANTHROPIC_API_KEY  – wie in Netlify-Env (Advisor)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Kontrollfluss testen, keine echten API-Calls/DB-Writes"
        type: boolean
        default: false

concurrency:
  group: ai-visibility
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bella-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencies installieren
        run: npm install --no-save @neondatabase/serverless @google/generative-ai @anthropic-ai/sdk

      - name: KI-Sichtbarkeit prüfen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/check-ai-visibility.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
