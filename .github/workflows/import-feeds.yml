name: Hundefutter-Feeds importieren

# Manueller Fallback/Debug — der tägliche Lauf passiert seit der Netlify-Migration
# über netlify/functions/import-feeds.mts (Scheduled Function, 05:00 UTC).
# Reuse der Scripts parse-feeds.py + load-dog-foods.mjs für lokale/manuelle Runs.
#
# Nötige Repo-Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL      – Neon-Connection-String
#   AWIN_FEED_URLS    – komma-separierte AWIN-Feed-Download-URLs
#   ADCELL_FEED_URLS  – komma-separierte AdCell-Feed-CSV-URLs

on:
  workflow_dispatch: {}      # manuell auslösbar (Fallback/Debug)

concurrency:
  group: import-feeds
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bella-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Loader-Dependency installieren
        run: npm install --no-save @neondatabase/serverless

      - name: Feeds parsen → dog_foods.json
        env:
          AWIN_FEED_URLS: ${{ secrets.AWIN_FEED_URLS }}
          ADCELL_FEED_URLS: ${{ secrets.ADCELL_FEED_URLS }}
        run: python scripts/parse-feeds.py

      - name: Nach Neon laden (Lifecycle + Preis-Historie + Diff)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/load-dog-foods.mjs

      - name: IndexNow ping (Bing & Co.)
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow-ping.mjs
