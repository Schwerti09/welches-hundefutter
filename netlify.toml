# ─── Build = Qualitäts-Gate ──────────────────────────────────────────────────
# Kein GitHub Actions. Der Gate läuft hier: `npm run ci` = typecheck + lint +
# test + build. Schlägt eine Stufe fehl, bricht der Build ab → kein Deploy.
# Für Deploy Previews (Pull Requests) gilt dasselbe — die Netlify-GitHub-App
# meldet den Status als Commit-Check zurück, der im Branch-Schutz für `main`
# als "required" eingetragen werden kann.
#
# Die blockierende Allergen-Eval (src/lib/advisor/allergen-eval.test.ts) läuft
# automatisch mit, weil DATABASE_URL in den Netlify-Env-Variablen gesetzt ist.
# Playwright-Smoke/Visual laufen NICHT im Build (Browser im Build-Image zu
# fragil) — manuell gegen eine Deploy-Preview-URL: siehe bella-app/README.md.
[build]
  base    = "bella-app"
  command = "npm run ci"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION            = "22"
  NODE_OPTIONS            = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[edge_functions]]
  path = "/*"
  function = "block-bad-bots"

# ─── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ─── Immutable cache für Next.js Chunks ───────────────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache für statische Assets ───────────────────────────────────────────────
[[headers]]
  for = "/*.{jpg,jpeg,png,webp,avif,svg,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
